<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentmore</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-white text-black font-sans">
    <main class="min-h-screen">
      <!-- Hero Section -->
      <section class="h-screen flex items-center justify-center bg-cover bg-center" style="background-image: url('hero.jpg');">
        <div class="text-center px-6">
          <h1 class="text-6xl md:text-8xl font-bold uppercase tracking-wide">Mentmore</h1>
          <p class="text-xl md:text-2xl mt-4">Low Signal. High Vibe.</p>
          <a href="#shop" class="inline-block mt-6 px-6 py-3 border border-black text-black hover:bg-black hover:text-white transition">
            Shop Now
          </a>
        </div>
      </section>

      <!-- Product Grid -->
      <section id="shop" class="py-16 px-6 bg-neutral-100">
        <h2 class="text-4xl text-center font-semibold mb-12">Signal Drop</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
          <div class="bg-white shadow hover:shadow-xl transition p-6 text-center">
            <div class="h-96 bg-gray-200 flex items-center justify-center">
              <span class="text-2xl font-bold">UNBOTHERED</span>
            </div>
            <p class="mt-4">$44.00 AUD</p>
            <a href="#" class="inline-block mt-2 text-blue-600 underline">View</a>
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="py-8 text-center text-gray-500 text-sm">
        &copy; 2025 Mentmore. All rights reserved.
      </footer>
    </main>
  </body>
</html>
